{% extends 'catalogo/base.html' %}

{% block titulo %}{{ accion }} libro — Biblioteca UPB{% endblock %}
{% block nav_admin %}activo{% endblock %}

{% block contenido %}
<section class="admin">
    <a class="volver" href="{% url 'catalogo:admin_libros' %}">&larr; Volver al listado</a>
    <h1>{{ accion }} libro</h1>

    <form method="post" class="formulario">
        {% csrf_token %}

        <label class="campo">
            <span>Título</span>
            <input type="text" name="titulo" value="{{ libro.titulo }}" required>
        </label>

        <label class="campo">
            <span>Autor</span>
            <select name="autor" required>
                <option value="">-- Selecciona un autor --</option>
                {% for autor in autores %}
                <option value="{{ autor.id }}" {% if autor_id == autor.id|stringformat:"s" %}selected{% endif %}>
                    {{ autor.nombre }}
                </option>
                {% endfor %}
            </select>
        </label>

        <label class="campo">
            <span>Género</span>
            <select name="genero" required>
                <option value="">-- Selecciona un género --</option>
                {% for genero in generos %}
                <option value="{{ genero.id }}" {% if genero_id == genero.id|stringformat:"s" %}selected{% endif %}>
                    {{ genero.nombre }}
                </option>
                {% endfor %}
            </select>
        </label>

        <label class="campo">
            <span>Año</span>
            <input type="number" name="anio" value="{{ libro.anio }}" required>
        </label>

        <label class="campo">
            <span>Stock</span>
            <input type="number" name="stock" min="0" value="{{ libro.stock|default:0 }}">
        </label>

        <label class="campo campo--ancho">
            <span>Sinopsis</span>
            <textarea name="sinopsis" rows="5">{{ libro.sinopsis }}</textarea>
        </label>

        <div class="formulario__acciones">
            <button type="submit" class="boton">Guardar</button>
        </div>
    </form>
</section>
{% endblock %}
